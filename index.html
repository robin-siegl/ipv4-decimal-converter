<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <script>
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('ipv4-decimal-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#141616' : '#f7f7f5');
      })();
    </script>
    <meta name="description" content="Convert an IPv4 address to a decimal integer, or back again. A simple, private, two-way converter with one-click copying.">
    <title>IPv4 ↔ Decimal</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to use the converter.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
